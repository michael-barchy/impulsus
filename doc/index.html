<!DOCTYPE html>
<html>

<head>
    <title>Impulsus | Documentation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="impulsus.png" />
    <script type="text/javascript">
        if (-1 !== navigator.userAgent.indexOf('Trident') && -1 !== navigator.userAgent.indexOf('rv:11')) {
            document.write('<link rel="stylesheet" href="https://unpkg.com/bulma@0.9.4/css/bulma.min.css">');
        } else {
            document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">');
        }
    </script>
    <style content="text/css">
        :root {
            --bulma-primary-h: 281deg;
            --bulma-primary-l: 72%;
        }

        .menu .menu-list a.is-active {
            background-color: hsl(var(--bulma-primary-h),
                    var(--bulma-primary-s),
                    var(--bulma-primary-l)) !important;
        }

        #page p,
        #page pre {
            margin-bottom: 1em;
        }
    </style>
    <link rel="stylesheet" href="ie11.css">
    <link rel="stylesheet" href="https://unpkg.com/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css">
    <script type="text/javascript" src="https://unpkg.com/showdown/dist/showdown.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/default.min.css">
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/languages/shell.min.js"></script>
    <script src="https://unpkg.com/highlightjs-copy/dist/highlightjs-copy.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/highlightjs-copy/dist/highlightjs-copy.min.css" />
    <script type="text/javascript">
        if (hljs) {
            hljs.addPlugin(new CopyButtonPlugin({ autohide: false }));
        }
    </script>
    <script type="text/javascript" src="impulsus.js"></script>
</head>

<body data-controller="wiki">
    <div class="container is-fluid px-0">
        <section id="menu" data-src="../menu.html"></section>
        <section class="hero mt-5">
            <div class="hero-body">
                <div class="columns">
                    <div class="column">
                        <section id="toc" data-wiki-target="menu" class="is-hidden"
                            data-src="https://raw.githubusercontent.com/wiki/michael-barchy/impulsus/Home.md"
                            data-action="impulsus:load->#menu">
                        </section>
                    </div>
                    <div class="column is-three-quarters">
                        <p class="title">Impulsus</p>
                        <section id="page" class="is-full is-hidden" data-wiki-target="wiki"
                            data-action="impulsus:before-load->#beforeLoad impulsus:load->#page" data-delay="200"
                            data-src="https://raw.githubusercontent.com/wiki/michael-barchy/impulsus/Install.md">
                        </section>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
